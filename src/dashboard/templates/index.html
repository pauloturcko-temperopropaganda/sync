<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Sync — Painel</title>
<style>
    :root {
        --accent: #111111;
        --bg: #F7F5F0;
        --card: #FFFFFF;
        --border: #E5E7EB;
        --text: #111827;
        --muted: #6B7280;
        --success: #166534;
        --success-bg: #DCFCE7;
        --error: #991B1B;
        --error-bg: #FEE2E2;
    }

    * { box-sizing: border-box; }

    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 28px 200px 60px;
    }

    /* Layout de duas colunas no topo: cards encostados na margem
       esquerda, console encostado na margem direita — as duas larguras
       são percentuais (40/60) pra sempre ocupar a div inteira, com o
       gap entre elas descontado via calc() pra não estourar 100%. */
    .top-layout {
        display: flex;
        gap: 20px;
        margin-bottom: 24px;
        align-items: stretch;
    }

    .left-col {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: calc(40% - 10px);
        flex-shrink: 0;
    }

    .right-col {
        width: calc(60% - 10px);
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        min-width: 0;
    }

    .right-col h2 {
        margin-bottom: 8px;
    }

    .right-col #console {
        flex: 1;
        min-height: 260px;
        max-height: 480px;
        overflow-y: auto;
    }

    header {
        margin: 0;
    }

    header .logo {
        height: 34px;
        width: auto;
        display: block;
    }

    header .subtitle {
        margin-top: 6px;
        color: var(--muted);
        font-size: 10pt;
    }

    button#sync-btn {
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 6px;
        padding: 12px 20px;
        font-size: 10.5pt;
        cursor: pointer;
        width: 100%;
    }

    button#sync-btn:disabled {
        background: #9CA3AF;
        cursor: not-allowed;
    }

    .cards-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }

    .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 14px 16px;
        min-width: 0;
    }

    .card .label {
        font-size: 8.5pt;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.03em;
    }

    .card .value {
        font-size: 16pt;
        font-weight: 600;
        margin-top: 3px;
        overflow-wrap: break-word;
    }

    .card .value.small {
        font-size: 11.5pt;
    }

    .sync-form {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .sync-form label {
        font-size: 8.5pt;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.03em;
        margin-bottom: 2px;
        display: block;
    }

    .sync-form select,
    .sync-form input.date-field {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 10px;
        font-size: 10pt;
        font-family: inherit;
        background: var(--card);
    }

    .sync-form .date-row {
        display: flex;
        gap: 8px;
    }

    .sync-form .date-row > div {
        flex: 1;
        min-width: 0;
    }

    a.button-link {
        display: inline-block;
        text-align: center;
        width: 100%;
        padding: 4px 0;
        font-size: 10.5pt;
        font-weight: 600;
        color: var(--accent);
        text-decoration: none;
        letter-spacing: 0.01em;
        transition: transform 0.15s ease;
    }

    a.button-link:hover {
        text-decoration: underline;
        transform: scale(1.03);
    }

    section {
        margin-bottom: 24px;
    }

    h2 {
        font-size: 12pt;
        margin: 0 0 10px 0;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        font-size: 9.5pt;
    }

    thead th {
        text-align: left;
        background: #F3F4F6;
        padding: 8px 12px;
        font-weight: 600;
        color: var(--muted);
    }

    tbody td {
        padding: 8px 12px;
        border-top: 1px solid var(--border);
    }

    .pill {
        display: inline-block;
        font-size: 8pt;
        padding: 2px 9px;
        border-radius: 10px;
        font-weight: 600;
    }

    .pill.success { background: var(--success-bg); color: var(--success); }
    .pill.failed { background: var(--error-bg); color: var(--error); }
    .pill.unknown { background: #F3F4F6; color: var(--muted); }

    #console {
        background: #0B1120;
        color: #4ADE80;
        font-family: 'Consolas', 'Courier New', monospace;
        font-size: 9pt;
        padding: 14px 16px;
        border-radius: 8px;
        height: 260px;
        overflow-y: auto;
        white-space: pre-wrap;
        line-height: 1.5;
    }

    #console .line-error { color: #FCA5A5; }
    #console .placeholder { color: #4ADE80; }
</style>
</head>
<body>

<div class="top-layout">
    <div class="left-col">
        <header>
            <img src="/branding/sync-logo-black.png" alt="Sync" class="logo">
            <div class="subtitle">Status da sincronização com a Meta Ads</div>
        </header>

        <div class="cards-row" id="overview-cards">
            <div class="card"><div class="label">Clientes com dados</div><div class="value">—</div></div>
            <div class="card"><div class="label">Período coberto</div><div class="value small">—</div></div>
            <div class="card"><div class="label">Campanhas</div><div class="value">—</div></div>
            <div class="card"><div class="label">Última atualização</div><div class="value small">—</div></div>
        </div>

        <div class="sync-form">
            <div>
                <label for="sync-client-select">Selecionar cliente</label>
                <select id="sync-client-select">
                    <option value="">Todos os clientes</option>
                </select>
            </div>
            <div class="date-row">
                <div>
                    <label for="sync-start-date">Data início</label>
                    <input type="text" class="date-field" id="sync-start-date" placeholder="DD/MM/AAAA" inputmode="numeric" maxlength="10">
                </div>
                <div>
                    <label for="sync-end-date">Data fim</label>
                    <input type="text" class="date-field" id="sync-end-date" placeholder="DD/MM/AAAA" inputmode="numeric" maxlength="10">
                </div>
            </div>
            <button id="sync-btn" onclick="triggerSync()">Atualizar agora</button>
            <a class="button-link" href="/relatorios">Gerar relatório de cliente</a>
        </div>
    </div>

    <div class="right-col">
        <h2>Console</h2>
        <div id="console"><span class="placeholder">Aguardando... clique em "Atualizar agora" para rodar a sincronização.</span></div>
    </div>
</div>

<section>
    <h2>Status por cliente</h2>
    <table>
        <thead>
            <tr>
                <th>Cliente</th>
                <th>Última sincronização</th>
                <th>Status</th>
                <th>Registros</th>
            </tr>
        </thead>
        <tbody id="clients-tbody">
            <tr><td colspan="4">Carregando...</td></tr>
        </tbody>
    </table>
</section>

<script>
let polling = null;

function fmtDate(iso) {
    if (!iso) return "—";
    const d = new Date(iso);
    return d.toLocaleString('pt-BR');
}

function fmtDateShort(isoDate) {
    // "2026-06-03" -> "03/06/26". Split manual (não usa Date) pra não
    // correr risco de o fuso horário mudar o dia exibido.
    if (!isoDate) return "—";
    const [y, m, d] = isoDate.split('-');
    return `${d}/${m}/${y.slice(2)}`;
}

function statusPill(status) {
    if (status === 'success') return '<span class="pill success">sucesso</span>';
    if (status === 'failed') return '<span class="pill failed">falhou</span>';
    return '<span class="pill unknown">sem sincronização ainda</span>';
}

async function refreshStatus() {
    const res = await fetch('/api/status');
    const data = await res.json();

    const ov = data.overview;
    const cards = document.querySelectorAll('#overview-cards .value');
    cards[0].textContent = data.clients.length;
    cards[1].textContent = ov.earliest_date && ov.latest_date
        ? `${fmtDateShort(ov.earliest_date)} a ${fmtDateShort(ov.latest_date)}`
        : "sem dado ainda";
    cards[2].textContent = ov.total_campaigns ?? 0;
    cards[3].textContent = fmtDate(ov.last_sync_at);

    const tbody = document.getElementById('clients-tbody');
    if (data.clients.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4">Nenhum cliente configurado ainda.</td></tr>';
    } else {
        tbody.innerHTML = data.clients.map(c => `
            <tr>
                <td>${c.client_name}</td>
                <td>${fmtDate(c.started_at)}</td>
                <td>${statusPill(c.status)}</td>
                <td>${c.records_processed ?? "—"}</td>
            </tr>
        `).join('');
    }

    renderConsole(data.sync_run);
    updateButton(data.sync_run.running);
}

const SPINNER_FRAMES = ['⠋', '⠙', '⠹', '⠸', '⠼', '⠴', '⠦', '⠧', '⠇', '⠏'];
const SPINNER_LABEL = 'Sincronizando dados';
let spinnerIndex = 0;
let spinnerTimer = null;

function startSpinner() {
    if (spinnerTimer) return;
    spinnerTimer = setInterval(() => {
        spinnerIndex = (spinnerIndex + 1) % SPINNER_FRAMES.length;
        const el = document.getElementById('console-spinner');
        if (el) el.textContent = SPINNER_FRAMES[spinnerIndex];
    }, 120);
}

function stopSpinner() {
    clearInterval(spinnerTimer);
    spinnerTimer = null;
}

function spinnerHtml() {
    return `<span id="console-spinner">${SPINNER_FRAMES[spinnerIndex]}</span> ${SPINNER_LABEL}...`;
}

function renderConsole(run) {
    const el = document.getElementById('console');

    if (!run.lines || run.lines.length === 0) {
        if (!run.running) {
            stopSpinner();
            return;
        }
        el.innerHTML = `<span class="placeholder">${spinnerHtml()}</span>`;
        startSpinner();
        return;
    }

    const lines = run.lines.map(l => {
        const cls = /falhou|erro/i.test(l) ? 'line-error' : '';
        return `<div class="${cls}">${escapeHtml(l)}</div>`;
    }).join('');

    if (run.running) {
        el.innerHTML = lines + `<div id="console-spinner-line">${spinnerHtml()}</div>`;
        startSpinner();
    } else {
        el.innerHTML = lines;
        stopSpinner();
    }

    el.scrollTop = el.scrollHeight;
}

function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function updateButton(running) {
    const btn = document.getElementById('sync-btn');
    btn.disabled = running;
    btn.textContent = running ? 'Sincronizando...' : 'Atualizar agora';

    if (running && !polling) {
        polling = setInterval(refreshStatus, 1500);
    } else if (!running && polling) {
        clearInterval(polling);
        polling = null;
        refreshStatus();
    }
}

async function loadSyncClients() {
    const res = await fetch('/api/clients');
    const clients = await res.json();
    const select = document.getElementById('sync-client-select');
    select.innerHTML = '<option value="">Todos os clientes</option>' +
        clients.map(c => `<option value="${c.slug}">${c.name}</option>`).join('');
}

function todayIso(offsetDays) {
    const d = new Date();
    d.setDate(d.getDate() + offsetDays);
    return d.toISOString().slice(0, 10);
}

// Campos de data como <input type="text"> mascarados pra DD/MM/AAAA
// em vez de <input type="date"> nativo: o formato de exibição do
// type="date" segue o idioma/região do navegador, não o `lang` do
// elemento (testado, não muda) — só assim dá pra garantir o padrão
// brasileiro pra qualquer usuário, em qualquer máquina.
function isoToBr(iso) {
    if (!iso) return '';
    const [y, m, d] = iso.split('-');
    return `${d}/${m}/${y}`;
}

function brToIso(br) {
    const match = (br || '').match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    return match ? `${match[3]}-${match[2]}-${match[1]}` : '';
}

function attachDateMask(input) {
    input.addEventListener('input', () => {
        let digits = input.value.replace(/\D/g, '').slice(0, 8);
        let formatted = digits;
        if (digits.length > 4) {
            formatted = `${digits.slice(0, 2)}/${digits.slice(2, 4)}/${digits.slice(4)}`;
        } else if (digits.length > 2) {
            formatted = `${digits.slice(0, 2)}/${digits.slice(2)}`;
        }
        input.value = formatted;
    });
}

async function triggerSync() {
    const password = prompt('Senha para atualizar os dados:');
    if (!password) return;

    const client_slug = document.getElementById('sync-client-select').value || null;
    const start = brToIso(document.getElementById('sync-start-date').value) || null;
    const end = brToIso(document.getElementById('sync-end-date').value) || null;

    const res = await fetch('/api/sync', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password, client_slug, start, end }),
    });

    if (res.status === 403) {
        alert('Senha incorreta.');
        return;
    }
    if (res.status === 409) {
        alert('Já existe uma sincronização em andamento.');
        return;
    }
    if (!res.ok) {
        const detail = (await res.json().catch(() => ({}))).detail || 'Erro ao iniciar a sincronização.';
        alert(detail);
        return;
    }

    polling = setInterval(refreshStatus, 1500);
    refreshStatus();
}

document.getElementById('sync-end-date').value = isoToBr(todayIso(0));
document.getElementById('sync-start-date').value = isoToBr(todayIso(-7));
attachDateMask(document.getElementById('sync-start-date'));
attachDateMask(document.getElementById('sync-end-date'));
loadSyncClients();

refreshStatus();
setInterval(refreshStatus, 10000);
</script>

</body>
</html>
